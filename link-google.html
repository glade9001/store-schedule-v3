<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/common.css">
<title>綁定 Google 帳號 — 莉學商行</title>
<style>
body { overflow-y: auto; height: auto; }

.setup-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  background: var(--bg);
}

.setup-card {
  background: white;
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 32px 24px;
  width: 100%;
  max-width: 400px;
}

.step-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 28px;
}
.step-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.2s;
}
.step-dot.active { background: var(--primary); }
.step-dot.done   { background: var(--accent); }
.step-line {
  flex: 1;
  max-width: 40px;
  height: 2px;
  background: var(--border);
}

.step-icon  { font-size: 48px; text-align: center; margin-bottom: 12px; }
.step-title { font-size: 20px; font-weight: 900; text-align: center; margin-bottom: 8px; }
.step-desc  { font-size: 13px; color: var(--text-muted); text-align: center; line-height: 1.7; margin-bottom: 24px; }

.btn-google {
  width: 100%;
  padding: 14px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  background: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 12px;
  transition: border-color 0.15s, background 0.15s;
}
.btn-google:hover  { border-color: #4285f4; background: #f8f9ff; }
.btn-google:active { opacity: 0.75; }
.btn-google:disabled { opacity: 0.45; cursor: not-allowed; }
.google-icon { width: 20px; height: 20px; flex-shrink: 0; }

.btn-primary-full {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  margin-bottom: 12px;
}
.btn-primary-full:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

.btn-skip {
  width: 100%;
  padding: 12px;
  background: transparent;
  color: var(--text-muted);
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.success-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #e8f5e9;
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 13px;
  font-weight: 700;
  color: #2e7d32;
}

.form-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
.form-input {
  width: 100%;
  height: 44px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 0 12px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  margin-bottom: 12px;
}
.form-input:focus { border-color: var(--primary); }

.err-msg { font-size: 12px; color: var(--danger); font-weight: 600; min-height: 18px; margin-bottom: 10px; }

.who-badge {
  background: #e8f0fe;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 700;
  color: var(--primary);
  text-align: center;
  margin-bottom: 20px;
}
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">載入中...</div>
</div>

<div class="setup-page" id="setupPage" style="display:none;">
  <div class="setup-card">

    <div class="step-indicator">
      <div class="step-dot" id="dot1"></div>
      <div class="step-line"></div>
      <div class="step-dot" id="dot2"></div>
    </div>

    <!-- Step 1: 綁定 Google -->
    <div id="step1">
      <div class="step-icon">🔗</div>
      <div class="step-title">綁定 Google 帳號</div>
      <div class="step-desc">
        請綁定你的 Google 帳號。<br>
        之後可以直接用 Google 一鍵登入，<br>
        無需輸入工號和密碼。
      </div>
      <div class="who-badge" id="whoBadge">—</div>
      <div class="err-msg" id="err1"></div>
      <button class="btn-google" id="linkGoogleBtn" onclick="doLinkGoogle()">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        綁定 Google 帳號
      </button>
    </div>

    <!-- Step 2: 修改密碼 -->
    <div id="step2" style="display:none;">
      <div class="step-icon">🔑</div>
      <div class="step-title">設定新密碼</div>
      <div class="step-desc">
        Google 帳號綁定成功！<br>
        建議修改管理員設定的初始密碼，<br>
        以確保帳號安全。
      </div>
      <div class="success-row">
        <span>✅ Google 帳號已綁定</span>
        <span id="linkedEmail" style="font-size:11px;font-weight:600;color:#2e7d32;margin-left:auto;word-break:break-all;"></span>
      </div>
      <label class="form-label">新密碼（至少 6 碼）</label>
      <input class="form-input" id="newPw" type="password" placeholder="輸入新密碼" autocomplete="new-password">
      <label class="form-label">確認新密碼</label>
      <input class="form-input" id="confirmPw" type="password" placeholder="再次輸入新密碼" autocomplete="new-password">
      <div class="err-msg" id="err2"></div>
      <button class="btn-primary-full" onclick="doChangePassword()">設定密碼並完成</button>
      <button class="btn-skip" onclick="goHome()">暫時跳過，稍後再設定</button>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { requireAuth, linkGoogle } from './js/auth.js';
import { updateUserProfile } from './js/db.js';
import { hideLoading, showToast } from './js/utils.js';
import { auth } from './js/firebase-config.js';

let user;

// 不檢查 Google 綁定（避免無限跳轉）
user = await requireAuth('login.html', { requireGoogle: false });

document.getElementById('whoBadge').textContent = `${user.empName || user.empId}（${user.empId}）`;
document.getElementById('dot1').classList.add('active');

document.getElementById('setupPage').style.display = 'flex';
hideLoading();

// ===== Step 1：綁定 Google =====
window.doLinkGoogle = async () => {
  const btn  = document.getElementById('linkGoogleBtn');
  const errEl = document.getElementById('err1');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '綁定中...';

  try {
    await linkGoogle();
    // 取得綁定的 Google email
    const googleProvider = auth.currentUser?.providerData?.find(p => p.providerId === 'google.com');
    const googleEmail = googleProvider?.email || '';
    // 更新 Firestore
    await updateUserProfile(user.uid, { googleLinked: true, googleEmail });
    // 進入 Step 2
    document.getElementById('dot1').classList.replace('active', 'done');
    document.getElementById('dot2').classList.add('active');
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = '';
    document.getElementById('linkedEmail').textContent = googleEmail;
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = `<svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>綁定 Google 帳號`;
    const code = e.code || '';
    if (code.includes('popup-closed') || code.includes('cancelled')) {
      errEl.textContent = '';
    } else if (code.includes('credential-already-in-use')) {
      errEl.textContent = '❌ 此 Google 帳號已被其他工號綁定';
    } else if (code.includes('popup-blocked')) {
      errEl.textContent = '⚠️ 彈出視窗被封鎖，請允許後再試';
    } else {
      errEl.textContent = '❌ 綁定失敗：' + e.message;
    }
  }
};

// ===== Step 2：修改密碼 =====
window.doChangePassword = async () => {
  const newPw     = document.getElementById('newPw').value;
  const confirmPw = document.getElementById('confirmPw').value;
  const errEl     = document.getElementById('err2');
  errEl.textContent = '';

  if (!newPw || newPw.length < 6) {
    errEl.textContent = '⚠️ 密碼至少 6 碼';
    return;
  }
  if (newPw !== confirmPw) {
    errEl.textContent = '⚠️ 兩次密碼不一致';
    return;
  }

  try {
    // 使用者剛登入，不需要重新驗證就能改密碼
    const { updatePassword } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    const { auth } = await import('./js/firebase-config.js');
    await updatePassword(auth.currentUser, newPw);
    goHome();
  } catch (e) {
    if (e.code?.includes('requires-recent-login')) {
      errEl.textContent = '⚠️ 請重新登入後再修改密碼';
    } else {
      errEl.textContent = '❌ 修改失敗：' + e.message;
    }
  }
};

window.goHome = () => window.location.replace('home.html');
</script>
</body>
</html>
