<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/common.css">
<title>莉學商行 — 登入</title>
<style>
body { overflow-y: auto; height: auto; }

.login-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 600;
}
.login-divider::before,
.login-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.btn-google {
  width: 100%;
  padding: 13px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  background: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: border-color 0.15s, background 0.15s;
}
.btn-google:hover  { border-color: #4285f4; background: #f8f9ff; }
.btn-google:active { opacity: 0.75; }
.btn-google:disabled { opacity: 0.5; cursor: not-allowed; }

.google-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">驗證身分中...</div>
</div>

<div class="login-page" id="loginPage" style="display:none;">
  <div class="login-logo">🏪</div>
  <div class="login-appname">莉學商行</div>
  <div class="login-sub">門市管理系統</div>

  <div class="login-card">
    <div class="form-group">
      <label class="form-label" for="empId">員工工號</label>
      <input
        class="form-input"
        id="empId"
        type="text"
        placeholder="例：A12345"
        maxlength="6"
        autocomplete="username"
        autocorrect="off"
        autocapitalize="characters"
        spellcheck="false"
      >
    </div>

    <div class="form-group">
      <label class="form-label" for="password">密碼</label>
      <div class="login-input-wrap">
        <input
          class="form-input"
          id="password"
          type="password"
          placeholder="請輸入密碼"
          autocomplete="current-password"
          style="padding-right: 44px;"
        >
        <button class="login-eye" id="eyeBtn" type="button" aria-label="顯示/隱藏密碼">👁</button>
      </div>
    </div>

    <div id="loginError" style="color:var(--danger);font-size:13px;font-weight:600;margin-bottom:12px;min-height:18px;"></div>

    <button class="btn-primary" id="loginBtn">登入</button>

    <div class="login-divider">或</div>

    <button class="btn-google" id="googleBtn" type="button">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      使用 Google 帳號登入
    </button>

    <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:16px;">
      忘記密碼請聯絡店長或管理員
    </p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { auth } from './js/firebase-config.js';
import { login, loginWithGoogle } from './js/auth.js';
import { hideLoading, showToast } from './js/utils.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// 已登入 → 直接跳首頁
onAuthStateChanged(auth, fbUser => {
  if (fbUser) {
    window.location.replace('home.html');
    return;
  }
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginPage').style.flexDirection = 'column';
  hideLoading();
  document.getElementById('empId').focus();
});

// 顯示/隱藏密碼
document.getElementById('eyeBtn').addEventListener('click', () => {
  const pw = document.getElementById('password');
  const btn = document.getElementById('eyeBtn');
  if (pw.type === 'password') { pw.type = 'text'; btn.textContent = '🙈'; }
  else { pw.type = 'password'; btn.textContent = '👁'; }
});

// 工號自動大寫格式化
document.getElementById('empId').addEventListener('input', e => {
  let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (v.length > 6) v = v.slice(0, 6);
  e.target.value = v;
});

// Enter 觸發登入
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('empId').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

// 登入
document.getElementById('loginBtn').addEventListener('click', doLogin);

// Google 登入
document.getElementById('googleBtn').addEventListener('click', doGoogleLogin);

async function doGoogleLogin() {
  const errEl  = document.getElementById('loginError');
  const btn    = document.getElementById('googleBtn');
  const loginBtn = document.getElementById('loginBtn');
  errEl.textContent = '';
  btn.disabled = true;
  loginBtn.disabled = true;
  btn.textContent = '登入中...';
  document.getElementById('loadingOverlay').classList.remove('hidden');
  document.getElementById('loadingText').textContent = '驗證 Google 帳號中...';

  try {
    await loginWithGoogle();
    // onAuthStateChanged 觸發跳轉
  } catch (e) {
    hideLoading();
    btn.disabled = false;
    loginBtn.disabled = false;
    btn.innerHTML = `<svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>使用 Google 帳號登入`;
    const code = e.code || '';
    if (code === 'not-linked') {
      errEl.textContent = '❌ 此 Google 帳號尚未綁定工號，請先用工號登入';
    } else if (code === 'resigned') {
      errEl.textContent = '❌ 此帳號已離職，無法登入';
    } else if (code.includes('popup-closed') || code.includes('cancelled')) {
      // 使用者自行關閉，不顯示錯誤
    } else if (code.includes('popup-blocked')) {
      errEl.textContent = '⚠️ 彈出視窗被封鎖，請允許後再試';
    } else {
      errEl.textContent = '❌ Google 登入失敗：' + e.message;
    }
  }
}

async function doLogin() {
  const empId    = document.getElementById('empId').value.trim().toUpperCase();
  const password = document.getElementById('password').value;
  const errEl    = document.getElementById('loginError');
  const btn      = document.getElementById('loginBtn');

  errEl.textContent = '';

  if (!empId) { errEl.textContent = '⚠️ 請輸入員工工號'; return; }
  if (!/^[A-Z][0-9]{5}$/.test(empId)) { errEl.textContent = '⚠️ 工號格式錯誤（1個字母 + 5碼數字）'; return; }
  if (!password) { errEl.textContent = '⚠️ 請輸入密碼'; return; }

  btn.disabled = true;
  btn.textContent = '登入中...';
  document.getElementById('googleBtn').disabled = true;
  document.getElementById('loadingOverlay').classList.remove('hidden');
  document.getElementById('loadingText').textContent = '驗證身分中...';

  try {
    await login(empId, password);
    // onAuthStateChanged 會觸發跳轉
  } catch (e) {
    hideLoading();
    btn.disabled = false;
    btn.textContent = '登入';
    document.getElementById('googleBtn').disabled = false;
    const code = e.code || '';
    if (code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) {
      errEl.textContent = '❌ 工號或密碼錯誤';
    } else if (code.includes('too-many-requests')) {
      errEl.textContent = '⚠️ 登入嘗試過多，請稍後再試';
    } else if (code.includes('network')) {
      errEl.textContent = '❌ 網路連線失敗，請確認網路狀態';
    } else {
      errEl.textContent = '❌ 登入失敗：' + e.message;
    }
  }
}
</script>
</body>
</html>
