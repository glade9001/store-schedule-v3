<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/common.css">
<title>莉學商行</title>
<style>
/* 首頁專屬 Header */
.home-header {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  padding: 14px 16px calc(14px + env(safe-area-inset-top, 0px));
  flex-shrink: 0;
  box-shadow: 0 2px 12px rgba(26,115,232,0.3);
}
.home-header-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.home-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  color: white;
  font-size: 17px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  transition: background 0.15s;
}
.home-avatar:active { background: rgba(255,255,255,0.4); }
.home-user-info { flex: 1; min-width: 0; }
.home-user-name { font-size: 15px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-user-sub  { font-size: 11px; opacity: 0.8; margin-top: 1px; }
.home-store-badge {
  background: rgba(255,255,255,0.2);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn-logout {
  background: rgba(255,255,255,0.18);
  border: none;
  color: white;
  height: 32px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  padding: 0 10px;
  flex-shrink: 0;
}

/* Header 設定按鈕 */
.btn-header-icon {
  background: rgba(255,255,255,0.18);
  border: none;
  color: white;
  width: 32px; height: 32px;
  border-radius: 9px;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.btn-header-icon:active { background: rgba(255,255,255,0.35); }

/* Bottom Sheet */
.bs-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 9500;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.bs-overlay.active { opacity: 1; pointer-events: all; }
.bs-sheet {
  position: fixed; bottom: 0; left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%; max-width: 520px;
  background: white;
  border-radius: 24px 24px 0 0;
  z-index: 9600;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.bs-sheet.active { transform: translateX(-50%) translateY(0); }
.bs-handle { width: 36px; height: 4px; background: #e2e8f0; border-radius: 2px; margin: 12px auto 16px; }
.bs-title { font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.5px; padding: 0 20px 10px; text-transform: uppercase; }
.bs-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 20px; cursor: pointer;
  transition: background 0.1s;
  border-top: 1px solid var(--border);
}
.bs-item:active { background: #f8fafc; }
.bs-item-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.bs-item-text { flex: 1; }
.bs-item-label { font-size: 15px; font-weight: 700; }
.bs-item-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.bs-item-arrow { color: var(--text-muted); font-size: 16px; }

/* 問候橫幅 */
.greeting-banner {
  background: linear-gradient(135deg, #1a73e8, #0d47a1);
  border-radius: var(--radius);
  padding: 22px 20px;
  margin-bottom: 14px;
  color: white;
  position: relative;
  overflow: hidden;
}
.greeting-banner::before {
  content: '';
  position: absolute;
  right: -20px; top: -20px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
}
.greeting-banner::after {
  content: '';
  position: absolute;
  right: 30px; bottom: -30px;
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
}
.greeting-time { font-size: 12px; opacity: 0.75; margin-bottom: 4px; }
.greeting-name { font-size: 22px; font-weight: 900; margin-bottom: 2px; }
.greeting-desc { font-size: 13px; opacity: 0.8; }
.greeting-badge {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 700;
  margin-top: 10px;
}

/* 功能按鈕 */
.func-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.func-btn {
  border-radius: 12px;
  padding: 12px 6px 10px;
  text-align: center;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  text-decoration: none;
}
.func-btn:active { transform: scale(0.94); box-shadow: none; }
.func-icon  { font-size: 24px; line-height: 1; }
.func-label { font-size: 11px; font-weight: 700; line-height: 1.2; }

.func-btn.blue   { background: linear-gradient(135deg, #e8f0fe, #d2e3fc); }
.func-btn.blue   .func-label { color: #1557b0; }
.func-btn.green  { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); }
.func-btn.green  .func-label { color: #1b5e20; }
.func-btn.purple { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); }
.func-btn.purple .func-label { color: #6b21a8; }
.func-btn.orange { background: linear-gradient(135deg, #fff3e0, #ffe0b2); }
.func-btn.orange .func-label { color: #b45309; }
.func-btn.gray   { background: linear-gradient(135deg, #f1f3f4, #e8eaed); }
.func-btn.gray   .func-label { color: #3c4043; }

/* 管理功能區分隔 */
.func-divider {
  border-top: 1px solid var(--border);
  margin: 12px 0 10px;
}
.func-section-title {
  font-size: 11px;
  font-weight: 800;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

/* 無班表提示 */
.no-schedule {
  text-align: center;
  padding: 24px 0;
  color: var(--text-muted);
  font-size: 13px;
}
.no-schedule-icon { font-size: 32px; margin-bottom: 8px; }

/* 週次標籤 */
.week-label-row {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.published-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  display: inline-block;
}

/* 角色預覽提示條 */
#previewBanner {
  display: none;
  background: linear-gradient(135deg, #f9ab00, #e67e22);
  color: white;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 800;
  text-align: center;
  cursor: pointer;
  flex-shrink: 0;
  letter-spacing: 0.3px;
}
#previewBanner.show { display: block; }

/* 角色預覽選項卡 */
.role-option-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.role-option-btn {
  background: white;
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.role-option-btn:active { transform: scale(0.96); }
.role-option-btn.selected { border-color: var(--primary); background: #e8f0fe; }
.role-option-icon { font-size: 28px; margin-bottom: 6px; }
.role-option-name { font-size: 14px; font-weight: 800; }
.role-option-sub  { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.role-option-btn.selected .role-option-name { color: var(--primary); }

/* 統計卡 */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.stat-card {
  background: white;
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform 0.15s;
}
.stat-card:active { transform: scale(0.97); }
.stat-icon  { font-size: 20px; margin-bottom: 3px; }
.stat-val   { font-size: 20px; font-weight: 900; color: var(--primary); line-height: 1; }
.stat-label { font-size: 10px; color: var(--text-muted); margin-top: 3px; font-weight: 600; }

/* 個人資料 Modal */
.profile-section { margin-bottom: 16px; }
.profile-avatar-lg {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  font-size: 28px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 12px;
  border: 3px solid rgba(26,115,232,0.2);
}
.profile-info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.profile-info-row:last-child { border-bottom: none; }
.profile-info-label { color: var(--text-muted); font-weight: 600; }
.profile-info-value { font-weight: 700; }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">載入中...</div>
</div>

<div id="appShell" hidden>

  <!-- 首頁 Header -->
  <div class="home-header">
    <div class="home-header-row">
      <div class="home-avatar" id="headerAvatar" onclick="openModal('profileModal')">?</div>
      <div class="home-user-info">
        <div class="home-user-name" id="headerName">—</div>
        <div class="home-user-sub" id="headerSub">—</div>
      </div>
      <div class="home-store-badge" id="headerStore">—</div>
      <button class="btn-header-icon" onclick="window.location.href='settings.html'" title="帳號設定">⚙️</button>
    </div>
  </div>

  <!-- 角色預覽提示條 -->
  <div id="previewBanner" onclick="exitPreview()">🎭 角色預覽模式 — 點此退出</div>

  <!-- 主內容 -->
  <div class="main-scroll">

    <!-- 問候橫幅 -->
    <div class="greeting-banner">
      <div class="greeting-time" id="greetDate"></div>
      <div class="greeting-name" id="greetName"></div>
      <div class="greeting-desc" id="greetText"></div>
      <div class="greeting-badge" id="greetBadge"></div>
    </div>

    <!-- 我的班表 -->
    <div class="section">
      <div class="section-label">我的班表</div>
      <div class="card" style="padding-bottom: 8px;">
        <div class="week-tabs-row">
          <button class="week-tab-btn active" id="tabThisWeek">本週</button>
          <button class="week-tab-btn" id="tabNextWeek" disabled>下週</button>
        </div>
        <div class="week-label-row" id="weekLabelRow"></div>
        <div id="scheduleList"></div>
      </div>
    </div>

    <!-- 統計卡 -->
    <div id="statsArea"></div>

    <!-- 功能按鈕 -->
    <div class="card" style="padding: 14px;">
      <div class="func-grid" id="funcGridPersonal"></div>
      <div id="funcMgmtWrap" style="display:none;">
        <div class="func-divider"></div>
        <div class="func-section-title">管理功能</div>
        <div class="func-grid" id="funcGridMgmt"></div>
      </div>
    </div>

  </div><!-- /main-scroll -->
</div><!-- /appShell -->

<!-- 個人資料 Modal -->
<div class="modal-overlay" id="profileModal" onclick="if(event.target===this)closeModal('profileModal')">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="profile-avatar-lg" id="profileAvatar"></div>
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:20px;font-weight:900;" id="profileName"></div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:3px;" id="profileSub"></div>
    </div>
    <div class="profile-section">
      <div class="profile-info-row">
        <span class="profile-info-label">員工工號</span>
        <span class="profile-info-value" id="profileEmpId"></span>
      </div>
      <div class="profile-info-row">
        <span class="profile-info-label">所屬門市</span>
        <span class="profile-info-value" id="profileStore"></span>
      </div>
      <div class="profile-info-row">
        <span class="profile-info-label">職位</span>
        <span class="profile-info-value" id="profileRole"></span>
      </div>
      <div class="profile-info-row">
        <span class="profile-info-label">系統權限</span>
        <span class="profile-info-value" id="profilePerm"></span>
      </div>
    </div>
    <button class="btn-primary" onclick="window.location.href='settings.html'">⚙️ 帳號設定</button>
    <button class="btn-secondary" id="rolePreviewEntryBtn" style="margin-top:8px;display:none;" onclick="closeModal('profileModal');openModal('rolePreviewModal')">🎭 角色預覽</button>
    <button class="btn-secondary" style="margin-top:8px;color:var(--danger);" id="logoutBtn">🚪 登出</button>
    <button class="btn-secondary" style="margin-top:8px;" onclick="closeModal('profileModal')">關閉</button>
  </div>
</div>

<!-- 角色預覽 Modal -->
<div class="modal-overlay" id="rolePreviewModal" onclick="if(event.target===this)closeModal('rolePreviewModal')">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div style="font-size:20px;font-weight:900;text-align:center;margin-bottom:6px;">🎭 角色預覽</div>
    <div style="font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:20px;">以不同角色體驗首頁介面（不影響實際資料）</div>
    <div class="role-option-grid" id="roleOptionGrid">
      <button class="role-option-btn" data-perm="employee" onclick="selectPreviewRole('employee')">
        <div class="role-option-icon">👤</div>
        <div class="role-option-name">員工</div>
        <div class="role-option-sub">查看班表、申請</div>
      </button>
      <button class="role-option-btn" data-perm="manager" onclick="selectPreviewRole('manager')">
        <div class="role-option-icon">🏪</div>
        <div class="role-option-name">店長</div>
        <div class="role-option-sub">排班、員工管理</div>
      </button>
      <button class="role-option-btn" data-perm="owner" onclick="selectPreviewRole('owner')">
        <div class="role-option-icon">👑</div>
        <div class="role-option-name">加盟主</div>
        <div class="role-option-sub">全門市管理</div>
      </button>
      <button class="role-option-btn" data-perm="admin" onclick="selectPreviewRole('admin')">
        <div class="role-option-icon">⚙️</div>
        <div class="role-option-name">系統管理員</div>
        <div class="role-option-sub">最高權限</div>
      </button>
    </div>
    <button class="btn-primary" id="applyPreviewBtn" onclick="applyPreview()" disabled>套用預覽</button>
    <button class="btn-secondary" id="exitPreviewBtn" style="margin-top:8px;display:none;" onclick="exitPreview();closeModal('rolePreviewModal')">↩ 恢復真實身份</button>
    <button class="btn-secondary" style="margin-top:8px;" onclick="closeModal('rolePreviewModal')">取消</button>
  </div>
</div>

<!-- 特補休/劃休 Bottom Sheet -->
<div class="bs-overlay" id="leaveOverlay" onclick="closeLeaveSheet()"></div>
<div class="bs-sheet" id="leaveSheet">
  <div class="bs-handle"></div>
  <div class="bs-title">特補休 · 劃休</div>
  <div class="bs-item" onclick="closeLeaveSheet();window.location.href='leave-request.html'">
    <div class="bs-item-icon" style="background:#e8f0fe;">📅</div>
    <div class="bs-item-text">
      <div class="bs-item-label">劃休申請</div>
      <div class="bs-item-sub">排休、特休、補休月曆申請</div>
    </div>
    <div class="bs-item-arrow">›</div>
  </div>
  <div class="bs-item" onclick="closeLeaveSheet();window.location.href='leave.html'">
    <div class="bs-item-icon" style="background:#f3e8ff;">🏖️</div>
    <div class="bs-item-text">
      <div class="bs-item-label">特補休紀錄</div>
      <div class="bs-item-sub">餘額查詢、批次與異動明細</div>
    </div>
    <div class="bs-item-arrow">›</div>
  </div>
  <div style="height:16px;"></div>
</div>

<!-- 更多管理 Bottom Sheet -->
<div class="bs-overlay" id="moreMgmtOverlay" onclick="closeMoreMgmt()"></div>
<div class="bs-sheet" id="moreMgmtSheet">
  <div class="bs-handle"></div>
  <div class="bs-title">更多管理功能</div>
  <div class="bs-item" onclick="closeMoreMgmt();window.location.href='leave.html'">
    <div class="bs-item-icon" style="background:#e8f5e9;">🌿</div>
    <div class="bs-item-text">
      <div class="bs-item-label">特補休管理</div>
      <div class="bs-item-sub">假別管理、紀錄查詢</div>
    </div>
    <div class="bs-item-arrow">›</div>
  </div>
  <div class="bs-item" onclick="closeMoreMgmt();window.location.href='employee.html'">
    <div class="bs-item-icon" style="background:#f3e8ff;">👥</div>
    <div class="bs-item-text">
      <div class="bs-item-label">員工管理</div>
      <div class="bs-item-sub">帳號、職位、調店、離職</div>
    </div>
    <div class="bs-item-arrow">›</div>
  </div>
  <div class="bs-item" onclick="closeMoreMgmt();window.location.href='analytics.html'">
    <div class="bs-item-icon" style="background:#e8f0fe;">📊</div>
    <div class="bs-item-text">
      <div class="bs-item-label">分析報表</div>
      <div class="bs-item-sub">出勤、工時統計</div>
    </div>
    <div class="bs-item-arrow">›</div>
  </div>
  <div class="bs-item" onclick="closeMoreMgmt();window.location.href='export.html'">
    <div class="bs-item-icon" style="background:#f1f3f4;">📤</div>
    <div class="bs-item-text">
      <div class="bs-item-label">匯出報表</div>
      <div class="bs-item-sub">匯出班表、薪資資料</div>
    </div>
    <div class="bs-item-arrow">›</div>
  </div>
  <div style="height:16px;"></div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { requireAuth, logout, canSchedule, canManageEmployee, canViewAllSalary, canSysConfig, isMultiStore } from './js/auth.js';
import { getWeekMeta, getUserWeekSchedule, onWeekMetaChange } from './js/db.js';
import {
  getCurrentWeekString, getNextWeekString, getWeekDates,
  DAY_NAMES, hideLoading, showToast, openModal, closeModal,
  getGreeting, PERM_LABELS, ROLE_LABELS, PERM_COLORS, isAutoPublished,
} from './js/utils.js';
import { shiftClass, getShiftHours, isLeaveShift } from './js/schedule-utils.js';

// ===== Service Worker =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ===== 初始化 =====
const user = await requireAuth();

let viewWeekStr = getCurrentWeekString();
let nextWeekStr = getNextWeekString();
let unsubNextWeek = null;
let previewPerm  = null; // null = 真實身份

function effectiveUser() {
  return previewPerm ? { ...user, permission: previewPerm } : user;
}

initHeader();
initGreeting();
renderQuickGrid();
subscribeNextWeek();
await renderSchedule();

hideLoading();
document.getElementById('appShell').removeAttribute('hidden');

// 顯示角色預覽入口（僅 admin）
if (canSysConfig(user)) {
  document.getElementById('rolePreviewEntryBtn').style.display = '';
}

// ===== Header =====
function initHeader() {
  const eu    = effectiveUser();
  const name  = user.empName || user.empId || '使用者';
  const perm  = PERM_LABELS[eu.permission] || '';
  const role  = ROLE_LABELS[user.role] || user.role || '';
  const color = PERM_COLORS[eu.permission] || '#34a853';

  document.getElementById('headerAvatar').textContent = name[0] || '?';
  document.getElementById('headerName').textContent   = name;
  document.getElementById('headerSub').textContent    = previewPerm
    ? `🎭 預覽：${perm}`
    : `${role} · ${perm}`;
  document.getElementById('headerStore').textContent  = user.store || '全門市';
  document.getElementById('headerStore').style.background = color + '44';

  // 個人資料 Modal（顯示真實身份）
  document.getElementById('profileAvatar').textContent  = name[0] || '?';
  document.getElementById('profileName').textContent    = name;
  document.getElementById('profileSub').textContent     = `${role} · ${PERM_LABELS[user.permission] || ''}`;
  document.getElementById('profileEmpId').textContent   = user.empId || '—';
  document.getElementById('profileStore').textContent   = user.store || '全門市';
  document.getElementById('profileRole').textContent    = role || '—';

// ===== 下週發布狀態即時監聽 =====
function subscribeNextWeek() {
  if (unsubNextWeek) unsubNextWeek();
  const store = user.store;
  if (!store) return;

  unsubNextWeek = onWeekMetaChange(store, nextWeekStr, meta => {
    const published = (meta?.published === true) || isAutoPublished(nextWeekStr);
    const btn = document.getElementById('tabNextWeek');
    btn.disabled = !published;
    btn.title    = published ? '' : '下週班表尚未發布';
  });
}

// ===== 班表渲染 =====
async function renderSchedule() {
  const store = user.store;
  const uid   = user.uid;
  const dates = getWeekDates(viewWeekStr);

  // 更新週次標籤
  const [, wNum] = viewWeekStr.split('-W');
  const startDate = dates[0];
  const endDate   = dates[6];
  const fmtDate = d => { const [,m,day] = d.split('-'); return `${parseInt(m)}/${parseInt(day)}`; };
  document.getElementById('weekLabelRow').innerHTML =
    `第 ${wNum} 週 &nbsp; ${fmtDate(startDate)} – ${fmtDate(endDate)}`;

  if (!store) {
    renderEmpty('全門市管理帳號無個人班表');
    return;
  }

  try {
    // 平行讀取週元資料 + 個人班表
    const [meta, entry] = await Promise.all([
      getWeekMeta(store, viewWeekStr),
      getUserWeekSchedule(store, viewWeekStr, uid),
    ]);

    const isThisWeek = viewWeekStr === getCurrentWeekString();
    const isPublished = meta?.published || isAutoPublished(viewWeekStr);

    // 下週未發布
    if (!isThisWeek && !isPublished) {
      renderEmpty('📋 下週班表尚未發布');
      return;
    }

    // 統計（本週才算，有無班表都顯示）
    if (isThisWeek) renderStats(entry);

    // 有班表資料
    if (!entry?.days || Object.keys(entry.days).length === 0) {
      renderEmpty('此週暫無排班記錄');
      return;
    }

    const shiftHours = {}; // TODO: 從 db.getStoreConfig 讀取（後續優化）
    const todayStr = new Date().toISOString().split('T')[0];

    const rows = dates.map((dateStr, i) => {
      const day = entry.days[dateStr];
      const shift = day?.shift || '';
      const hours = shift && !isLeaveShift(shift) ? (day?.hours ?? getShiftHours(shift, shiftHours)) : 0;
      const note  = day?.note || '';
      const isToday = dateStr === todayStr;

      return `
        <div class="schedule-row" style="${isToday ? 'background:#f0f7ff;border-radius:8px;padding:10px 8px;margin:0 -8px;' : ''}">
          <span class="sched-day" style="${isToday ? 'color:var(--primary);' : ''}">${DAY_NAMES[i]}</span>
          <span class="sched-date" style="${isToday ? 'color:var(--primary);font-weight:800;' : ''}">${fmtDate(dateStr)}</span>
          <span class="sched-shift ${shiftClass(shift)}">${shift || '—'}</span>
          <span class="sched-hours">${hours > 0 ? hours + 'h' : ''}</span>
        </div>
        ${note ? `<div class="sched-note" style="color:var(--text-muted);padding-left:84px;font-size:11px;margin-top:-2px;padding-bottom:4px;">${note}</div>` : ''}
      `;
    }).join('');

    document.getElementById('scheduleList').innerHTML = rows;

  } catch (e) {
    renderEmpty('班表讀取失敗，請稍後再試');
    console.error(e);
  }
}

function renderEmpty(msg) {
  document.getElementById('scheduleList').innerHTML = `
    <div class="no-schedule">
      <div class="no-schedule-icon">📭</div>
      <div>${msg}</div>
    </div>`;
}

// 計算任意日期的週字串
function weekStringOf(date) {
  const d = new Date(date);
  const day = d.getDay() || 7;
  const mon = new Date(d);
  mon.setDate(d.getDate() - day + 1);
  mon.setHours(0, 0, 0, 0);
  const yr = mon.getFullYear();
  const first = new Date(yr, 0, 1);
  const w = Math.ceil((((mon - first) / 86400000) + first.getDay() + 1) / 7);
  return `${yr}-W${w < 10 ? '0' + w : w}`;
}

async function renderStats(entry) {
  if (!user.store) return;
  const isPartTime = user.role === '工讀';
  const area = document.getElementById('statsArea');

  if (isPartTime) {
    // 工讀：本週工時 ＋ 本月工時
    area.innerHTML = `
      <div class="stats-row" style="grid-template-columns:repeat(2,1fr);">
        <div class="stat-card">
          <div class="stat-icon">⏱️</div>
          <div class="stat-val" id="statWeekH">--</div>
          <div class="stat-label">本週工時 (h)</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📆</div>
          <div class="stat-val" id="statMonthH">--</div>
          <div class="stat-label">本月工時 (h)</div>
        </div>
      </div>`;

    // 本週工時（從已載入資料算）
    let weekH = 0;
    if (entry?.days) {
      for (const day of Object.values(entry.days)) {
        if (day.shift && !isLeaveShift(day.shift))
          weekH += day.hours ?? getShiftHours(day.shift, {});
      }
    }
    document.getElementById('statWeekH').textContent = weekH;

    // 本月工時（非同步）
    loadMonthHours();

  } else {
    // 正職：特休 ＋ 補休 ＋ 本月加班
    area.innerHTML = `
      <div class="stats-row">
        <div class="stat-card" onclick="window.location.href='leave.html'">
          <div class="stat-icon">🏖️</div>
          <div class="stat-val" style="color:var(--accent);">--</div>
          <div class="stat-label">特休餘額 (天)</div>
        </div>
        <div class="stat-card" onclick="window.location.href='leave.html'">
          <div class="stat-icon">📅</div>
          <div class="stat-val" style="color:var(--accent);">--</div>
          <div class="stat-label">補休餘額 (天)</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⚡</div>
          <div class="stat-val" style="color:var(--danger);">--</div>
          <div class="stat-label">本月加班 (h)</div>
        </div>
      </div>`;
  }
}

async function loadMonthHours() {
  const now   = new Date();
  const year  = now.getFullYear();
  const month = now.getMonth();

  // 收集本月所有周次
  const weeks = new Set();
  const d = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  while (d <= last) { weeks.add(weekStringOf(d)); d.setDate(d.getDate() + 7); }
  weeks.add(weekStringOf(last));

  let monthH = 0;
  await Promise.all([...weeks].map(async weekStr => {
    try {
      const entry = await getUserWeekSchedule(user.store, weekStr, user.uid);
      if (!entry?.days) return;
      for (const [dateStr, day] of Object.entries(entry.days)) {
        const dd = new Date(dateStr);
        if (dd.getFullYear() === year && dd.getMonth() === month
            && day.shift && !isLeaveShift(day.shift)) {
          monthH += day.hours ?? getShiftHours(day.shift, {});
        }
      }
    } catch { /* 不阻擋 */ }
  }));

  const el = document.getElementById('statMonthH');
  if (el) el.textContent = monthH;
}
