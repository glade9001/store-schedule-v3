<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/common.css">
<title>⚙️ 帳號設定 — 莉學商行</title>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">載入中...</div>
</div>

<div id="appShell" hidden>
  <header class="top-header">
    <button class="btn-back" onclick="window.location.href='home.html'">← 首頁</button>
    <h1 class="header-title">⚙️ 帳號設定</h1>
  </header>

  <div class="maintenance-wrap">
    <div class="maintenance-icon">⚙️</div>
    <h2 class="maintenance-title">功能開發中</h2>
    <p class="maintenance-desc">此功能正在建置中，敬請期待。<br>完成後將自動上線。</p>
    <button class="btn-primary" style="max-width:200px;" onclick="window.location.href='home.html'">返回首頁</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { requireAuth } from './js/auth.js';
import { hideLoading } from './js/utils.js';
(async () => {
  await requireAuth();
  document.getElementById('appShell').removeAttribute('hidden');
  hideLoading();
})();
</script>
</body>
</html>
